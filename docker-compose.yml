# dsh is internal only. nginx terminates HTTPS (self-signed RSA) on the host.
# 
#   cp .env.example .env
#   # set DSH_TRUSTED_HOSTS=your-lan-ip   and DSH_ALLOW_REMOTE_CONFIGURATION=1 for LAN UI
#   docker compose up -d
#   open https://127.0.0.1:8443  or  https://<lan-ip>:8443
# 
# NEW: Gateway auth (compulsory for this docker compose)
#       basic auth enabled via nginx (AUTH_USER / AUTH_PASSWORD in .env)
#       nginx is the only entrypoint; dsh is kept exactly as original (internal only)
# 
# Compose .env is ONLY for Docker Compose (not mounted into dsh).
# Do not put DSH_ALLOW_REMOTE_CONFIGURATION / DSH_TRUSTED_HOSTS in the agent workspace.

services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/stefankhor/dsh-docker:latest}
    expose:
      - "3080"
    environment:
      DSH_PORT: "3080"
      DSH_HOME: /home/dsh/.dsh
      # launch-only: must come from compose environment, never from workspace/.env
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      DSH_ALLOW_REMOTE_CONFIGURATION: ${DSH_ALLOW_REMOTE_CONFIGURATION:-0}
      DSH_TELEMETRY_DISABLED: ${DSH_TELEMETRY_DISABLED:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ${DSH_HOME_PATH:-dsh-home}:/home/dsh/.dsh
      # default ./workspace — NOT the compose repo (avoids mounting compose .env into dsh)
      - ${DSH_WORKSPACE:-./workspace}:/home/dsh/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      AUTH_USER: ${AUTH_USER:-dsh}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx-certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - dsh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  dsh-home:
  nginx-certs:
