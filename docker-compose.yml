services:
  dsh:
    image: ghcr.io/${GHCR_OWNER:-local}/dsh-docker:latest
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-latest}
    ports:
      - "${DSH_PORT:-3080}:3080"
    volumes:
      - ${DSH_WORKSPACE:-.}:/home/dsh/workspace
    environment:
      DSH_PORT: "3080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
