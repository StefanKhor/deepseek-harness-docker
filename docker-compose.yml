# Persist:
#   DSH_HOME     → settings, API keys, sessions  (default: Docker volume "dsh-home")
#   workspace    → project files the agent edits (default: current directory)
#
# Bind to a host path instead of a named volume (survives Docker uninstall better):
#   DSH_HOME_PATH=./data/dsh-home docker compose up -d
#   DSH_WORKSPACE=/path/to/project docker compose up -d

services:
  dsh:
    image: ghcr.io/stefankhor/dsh-docker:latest
    ports:
      - "${DSH_PORT:-3080}:3080"
    environment:
      DSH_PORT: "3080"
      # upstream: resolveDshHome() → $DSH_HOME or ~/.dsh
      DSH_HOME: /home/dsh/.dsh
    volumes:
      - ${DSH_HOME_PATH:-dsh-home}:/home/dsh/.dsh
      - ${DSH_WORKSPACE:-.}:/home/dsh/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

volumes:
  dsh-home:
