# dsh is internal only. The bundled nginx terminates HTTPS (self-signed RSA)
# and provides optional HTTP basic auth in front of dsh.
#
#   cp .env.example .env
#   # set AUTH_PASSWORD (recommended)
#   docker compose up -d
#   docker compose logs dsh | grep 'token='
#   open https://127.0.0.1:8443/?token=<token>
#     (or https://<lan-ip>:8443/?token=<token>)
#
# Starting with dsh 0.2 the Web UI is protected by dsh's own one-time
# browser-session token. The first request exchanges the token for a persistent
# signed cookie, so later visits do not need it. nginx rewrites the proxied
# Host/Origin to loopback, so LAN clients work without extra trust config.
#
# Compose .env is ONLY for Docker Compose (not mounted into dsh). Keep
# DEEPSEEK_API_KEY and any secrets out of the agent workspace.

services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/stefankhor/dsh-docker:latest}
    expose:
      - "3080"
    environment:
      DSH_PORT: "3080"
      DSH_HOME: /home/dsh/.dsh
      # Only needed when dsh is reached directly on a non-loopback authority
      # (not through the bundled nginx). Comma-separated host or host:port.
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      DSH_TELEMETRY_DISABLED: ${DSH_TELEMETRY_DISABLED:-1}
      # Browser-session cookie lifetime in days (upstream default: 30).
      DSH_BROWSER_COOKIE_MAX_AGE_DAYS: ${DSH_BROWSER_COOKIE_MAX_AGE_DAYS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - ${DSH_HOME_PATH:-dsh-home}:/home/dsh/.dsh
      # User project files dsh can access (read/write in the UI)
      - ${DSH_WORKSPACE:-./workspace}:/home/dsh/workspace
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      AUTH_USER: ${AUTH_USER:-dsh}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx-certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      dsh:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  dsh-home:
  nginx-certs:
