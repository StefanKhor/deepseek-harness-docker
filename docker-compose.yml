# dsh is internal only. Caddy terminates HTTPS (self-signed) on the host.
#
#   docker compose up -d
#   open https://127.0.0.1:8443  or  https://<lan-ip>:8443
#   accept the certificate warning once
#
# Copy env template:
#   cp .env.example .env
#
# Standard HTTPS port:
#   HTTPS_PORT=443 docker compose up -d

services:
  dsh:
    image: ghcr.io/stefankhor/dsh-docker:latest
    expose:
      - "3080"
    environment:
      DSH_PORT: "3080"
      DSH_HOME: /home/dsh/.dsh
    volumes:
      - ${DSH_HOME_PATH:-dsh-home}:/home/dsh/.dsh
      - ${DSH_WORKSPACE:-.}:/home/dsh/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      AUTH_USER: ${AUTH_USER:-dsh}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      CADDY_LISTEN: "443"
    volumes:
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - dsh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  dsh-home:
  caddy-data:
  caddy-config:
