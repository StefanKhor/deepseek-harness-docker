# dsh is internal only. nginx terminates HTTPS (self-signed RSA) on the host.
#
#   docker compose up -d
#   open https://127.0.0.1:8443  or  https://<lan-ip>:8443
#   accept the certificate warning once (needed for crypto.randomUUID on LAN)
#
# Password:
#   echo 'AUTH_PASSWORD=secret' > .env && docker compose up -d
#
# Standard HTTPS port:
#   CADDY_PORT=443  →  use HTTPS_PORT instead
#   HTTPS_PORT=443 docker compose up -d  →  https://host
#
# Paths:
#   DSH_HOME_PATH=./dsh-home DSH_WORKSPACE=/path/to/project docker compose up -d

services:
  dsh:
    image: ghcr.io/stefankhor/dsh-docker:latest
    expose:
      - "3080"
    environment:
      DSH_PORT: "3080"
      DSH_HOME: /home/dsh/.dsh
    volumes:
      - ${DSH_HOME_PATH:-dsh-home}:/home/dsh/.dsh
      - ${DSH_WORKSPACE:-.}:/home/dsh/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      AUTH_USER: ${AUTH_USER:-dsh}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx-certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - dsh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  dsh-home:
  nginx-certs:
