# dsh is internal only. Caddy serves HTTPS on the host (secure context for the web UI).
#
#   docker compose up -d
#   open https://127.0.0.1:3080  or  https://<lan-ip>:3080
#   (accept self-signed cert once)
#
# Password:
#   echo 'AUTH_PASSWORD=secret' > .env && docker compose up -d
#
# Paths:
#   DSH_HOME_PATH=./dsh-home DSH_WORKSPACE=/path/to/project docker compose up -d

services:
  dsh:
    image: ghcr.io/stefankhor/dsh-docker:latest
    expose:
      - "3080"
    environment:
      DSH_PORT: "3080"
      DSH_HOME: /home/dsh/.dsh
    volumes:
      - ${DSH_HOME_PATH:-dsh-home}:/home/dsh/.dsh
      - ${DSH_WORKSPACE:-.}:/home/dsh/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

  caddy:
    image: caddy:2-alpine
    ports:
      - "${CADDY_PORT:-3080}:443"
    environment:
      AUTH_USER: ${AUTH_USER:-dsh}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      CADDY_LISTEN: "443"
    volumes:
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - dsh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  dsh-home:
  caddy-data:
  caddy-config:
