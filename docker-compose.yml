# dsh listens on host loopback only (127.0.0.1).
# For LAN/remote, use docker-compose.caddy.yml (Caddy publishes the public port).
#
# Paths:
#   DSH_HOME_PATH=./data/dsh-home docker compose up -d
#   DSH_WORKSPACE=/path/to/project docker compose up -d

services:
  dsh:
    image: ghcr.io/stefankhor/dsh-docker:latest
    ports:
      # local only — not reachable from LAN
      - "127.0.0.1:${DSH_PORT:-3080}:3080"
    environment:
      DSH_PORT: "3080"
      DSH_HOME: /home/dsh/.dsh
    volumes:
      - ${DSH_HOME_PATH:-dsh-home}:/home/dsh/.dsh
      - ${DSH_WORKSPACE:-.}:/home/dsh/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

volumes:
  dsh-home:
