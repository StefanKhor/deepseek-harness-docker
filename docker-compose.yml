services:
  dsh:
    image: ghcr.io/stefankhor/dsh-docker:latest
    ports:
      - "${DSH_PORT:-3080}:3080"
    volumes:
      - ${DSH_WORKSPACE:-.}:/home/dsh/workspace
    environment:
      DSH_PORT: "3080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
