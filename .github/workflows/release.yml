name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/stefankhor/dsh-docker
  HUB_IMAGE: stefankhor/dsh-docker

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${TAG}"

      - name: Resolve @deepseek-ai/dsh version
        id: ver
        run: |
          set -euo pipefail
          VER="$(npm view @deepseek-ai/dsh version)"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "Resolved @deepseek-ai/dsh@${VER}"

      - name: Detect Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.version }}"
          DSH_VER="${{ steps.ver.outputs.version }}"
          TAGS="${GHCR_IMAGE}:latest
          ${GHCR_IMAGE}:v${TAG}
          ${GHCR_IMAGE}:${DSH_VER}"
          if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
            TAGS="${TAGS}
            ${HUB_IMAGE}:latest
            ${HUB_IMAGE}:v${TAG}
            ${HUB_IMAGE}:${DSH_VER}"
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Will push:"
          echo "$TAGS"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=Unofficial community Docker image for DeepSeek Harness (dsh)
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.vendor=community
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
