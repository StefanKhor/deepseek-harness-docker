name: docker

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/docker.yml
      - docker-entrypoint.sh
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/docker.yml
      - docker-entrypoint.sh
  schedule:
    # Check upstream for a new @deepseek-ai/dsh release a few times a day.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "npm version of @deepseek-ai/dsh"
        required: false
        default: "latest"
      force:
        description: "Rebuild even if GHCR tag exists"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  actions: write

env:
  GHCR_IMAGE: ghcr.io/stefankhor/dsh-docker
  HUB_IMAGE: stefankhor/dsh-docker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve @deepseek-ai/dsh version
        id: ver
        run: |
          set -euo pipefail
          REQ="${{ github.event.inputs.dsh_version || 'latest' }}"
          if [ "$REQ" = "latest" ] || [ -z "$REQ" ]; then
            VER="$(npm view @deepseek-ai/dsh version)"
          else
            VER="$REQ"
            npm view "@deepseek-ai/dsh@${VER}" version >/dev/null
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "Resolved @deepseek-ai/dsh@${VER}"

      - name: Check existing GHCR tag
        id: skip
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          PKG="dsh-docker"
          exists=false
          for path in "users/${OWNER}/packages/container/${PKG}/versions" "orgs/${OWNER}/packages/container/${PKG}/versions"; do
            if gh api "${path}" --paginate --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -qx "${TAG}"; then
              exists=true
              break
            fi
          done
          echo "exists=${exists}" >> "${GITHUB_OUTPUT}"
          if [ "${exists}" = "true" ]; then
            echo "Tag ${TAG} already on GHCR — skip rebuild (use force=true to republish)"
          else
            echo "Tag ${TAG} not found — will build"
          fi

      - name: Detect Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub push enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets missing — GHCR only"
          fi

      - name: Set up QEMU
        if: steps.skip.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: steps.skip.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.skip.outputs.exists != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.skip.outputs.exists != 'true' && github.event_name != 'pull_request' && steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        if: steps.skip.outputs.exists != 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            TAGS="${GHCR_IMAGE}:pr-${PR}"
          else
            TAGS="${GHCR_IMAGE}:latest,${GHCR_IMAGE}:${VER}"
            if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
              TAGS="${TAGS},${HUB_IMAGE}:latest,${HUB_IMAGE}:${VER}"
            fi
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Will push: $TAGS"

      - name: Build and push
        id: build
        if: steps.skip.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=Unofficial community Docker image for DeepSeek Harness (dsh)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.vendor=community
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Build linux/amd64, boot it with a noexec /tmp (as Compose does), and verify
  # the healthcheck plus the browser-session token exchange. Runs on PRs and
  # pushes so a broken image never reaches a registry tag.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose file and shell scripts
        run: |
          set -euo pipefail
          docker compose config >/dev/null
          sh -n docker-entrypoint.sh
          sh -n nginx/entrypoint.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: dsh-docker:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max
          provenance: false
          sbom: false

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name dsh-smoke --tmpfs /tmp:noexec -p 127.0.0.1:3080:3080 dsh-docker:smoke
          for _ in $(seq 1 30); do
            status="$(docker inspect dsh-smoke --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)"
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && { docker logs dsh-smoke; exit 1; }
            sleep 3
          done
          [ "$(docker inspect dsh-smoke --format '{{.State.Health.Status}}')" = "healthy" ] || { docker logs dsh-smoke; exit 1; }

          # Public static asset proves the proxy and web server are serving.
          curl -fsS http://127.0.0.1:3080/manifest.webmanifest >/dev/null

          TOKEN="$(docker logs dsh-smoke 2>&1 | grep -o 'token=[A-Za-z0-9_-]*' | head -1 | cut -d= -f2)"
          [ -n "$TOKEN" ]
          COOKIE="$(curl -sS -D - -o /dev/null "http://127.0.0.1:3080/?token=${TOKEN}" | grep -i '^set-cookie:' | sed 's/^[Ss]et-[Cc]ookie: //' | cut -d';' -f1)"
          [ -n "$COOKIE" ]
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "Cookie: $COOKIE" http://127.0.0.1:3080/)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/)" = "401"
          docker rm -f dsh-smoke
