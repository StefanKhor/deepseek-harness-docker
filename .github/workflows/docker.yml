name: docker

on:
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/docker.yml
      - patches/**
      - docker-entrypoint.sh
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .github/workflows/docker.yml
      - patches/**
      - docker-entrypoint.sh
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "npm version of @deepseek-ai/dsh"
        required: false
        default: "latest"
      force:
        description: "Rebuild even if GHCR tag exists"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  actions: write

env:
  GHCR_IMAGE: ghcr.io/stefankhor/dsh-docker
  HUB_IMAGE: stefankhor/dsh-docker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve @deepseek-ai/dsh version
        id: ver
        run: |
          set -euo pipefail
          REQ="${{ github.event.inputs.dsh_version || 'latest' }}"
          if [ "$REQ" = "latest" ] || [ -z "$REQ" ]; then
            VER="$(npm view @deepseek-ai/dsh version)"
          else
            VER="$REQ"
            npm view "@deepseek-ai/dsh@${VER}" version >/dev/null
          fi
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
          echo "Resolved @deepseek-ai/dsh@${VER}"

      - name: Check existing GHCR tag
        id: skip
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.inputs.force != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          PKG="dsh-docker"
          exists=false
          for path in "users/${OWNER}/packages/container/${PKG}/versions" "orgs/${OWNER}/packages/container/${PKG}/versions"; do
            if gh api "${path}" --paginate --jq '.[].metadata.container.tags[]' 2>/dev/null | grep -qx "${TAG}"; then
              exists=true
              break
            fi
          done
          echo "exists=${exists}" >> "${GITHUB_OUTPUT}"
          if [ "${exists}" = "true" ]; then
            echo "Tag ${TAG} already on GHCR — skip rebuild (use force=true to republish)"
          else
            echo "Tag ${TAG} not found — will build"
          fi

      - name: Detect Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub push enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets missing — GHCR only"
          fi

      - name: Set up QEMU
        if: steps.skip.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        if: steps.skip.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.skip.outputs.exists != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.skip.outputs.exists != 'true' && github.event_name != 'pull_request' && steps.hub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        if: steps.skip.outputs.exists != 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR="${{ github.event.pull_request.number }}"
            TAGS="${GHCR_IMAGE}:pr-${PR}"
          else
            TAGS="${GHCR_IMAGE}:latest
            ${GHCR_IMAGE}:${VER}"
            if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
              TAGS="${TAGS}
            ${HUB_IMAGE}:latest
            ${HUB_IMAGE}:${VER}"
            fi
          fi
          {
            echo "list<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Will push:"
          echo "$TAGS"

      - name: Build and push
        id: build
        if: steps.skip.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=dsh-docker
            org.opencontainers.image.description=Unofficial community Docker image for DeepSeek Harness (dsh)
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.vendor=community
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
