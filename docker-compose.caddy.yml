# Optional Caddy HTTPS in front of dsh (same install folder).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Open https://127.0.0.1:8443 or https://<lan-ip>:8443 (accept self-signed cert).
# dsh stays on the internal network only; Caddy publishes HTTPS.

services:
  dsh:
    # no host publish — only reachable via Caddy on the compose network
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dsh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
