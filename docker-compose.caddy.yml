# Optional Caddy HTTP reverse proxy in front of dsh (same install folder).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# Open http://127.0.0.1:3081
# dsh stays internal; Caddy publishes the host port.

services:
  dsh:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "${CADDY_PORT:-3081}:3081"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - dsh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
