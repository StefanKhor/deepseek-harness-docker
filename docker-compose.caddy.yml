# LAN / remote access: Caddy is required (dsh stays off the public interface).
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#   open http://<lan-ip>:3081
#
# Optional password (browser basic auth):
#   AUTH_PASSWORD=secret AUTH_USER=dsh docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d

services:
  dsh:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "${CADDY_PORT:-3081}:3081"
    environment:
      AUTH_USER: ${AUTH_USER:-dsh}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      CADDY_LISTEN: "3081"
    volumes:
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - dsh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
